<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>OPERAÇÃO APOGEU | FILIPE OLIVEIRA SANTOS</title>

  <!-- PWA & Favicon -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APOGEU ARQ">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="assets/icon-512.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{height:100%;overflow:hidden;background:#000}
    :root{
      --bg:#000;
      --surface:rgba(13,13,13,.84);
      --elevated:rgba(26,26,26,.75);
      --card:rgba(20,20,20,.75);
      --gold:#FFD700;
      --gold-light:#FFC107;
      --gold-dark:#FFA000;
      --yellow:#b8860b;--yellow-light:#d4a017;
      --blue:#1e3a8a;--blue-light:#1e40af;
      --red:#7f1d1d;--red-light:#ff3333;
      --green:#14532d;--green-light:#22c55e;
      --text:#e5e5e5;--text-dim:#a3a3a3;--text-subtle:#525252;
      --border:rgba(255,255,255,.08);--border-light:rgba(255,255,255,.14);
      --shadow:0 18px 45px rgba(0,0,0,.65);
      --template-pad:22px;
      --glass-blur:10px;
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --safe-left:env(safe-area-inset-left);
      --safe-right:env(safe-area-inset-right);
    }
    body{background:#000;color:var(--text);font-family:'Inter',sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative;isolation:isolate;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    
    /* MARCA D'ÁGUA DINÂMICA (Controlada por variável CSS) */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image: var(--bg-watermark, url("assets/watermark.jpg"));
      background-repeat:no-repeat;
      background-position:center;
      background-size:min(780px,90vw) auto;
      opacity:.12;
      filter:contrast(1.05) saturate(.9);
      pointer-events:none;
      z-index:-1;
    }
    
    .glass{backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
    
    /* CABEÇALHO COM BANNER DO CONGRESSO (Controlado por variável CSS) */
    .header{position:relative;height:88px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 max(var(--template-pad),var(--safe-left));padding-right:max(var(--template-pad),var(--safe-right));padding-top:var(--safe-top);flex-shrink:0;overflow:hidden;isolation:isolate}
    .header.glass{box-shadow:0 10px 35px rgba(0,0,0,.45)}
    .header::before{content:"";position:absolute;inset:0;background:radial-gradient(1200px 200px at 20% 10%,rgba(255,215,0,.18),transparent 60%),radial-gradient(900px 240px at 80% 0%,rgba(30,64,175,.22),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.04),transparent 55%);z-index:-2}
    
    .header::after{
      content:"";
      position:absolute;
      inset:-10px;
      background-image: var(--bg-banner, url("assets/banner.jpg"));
      background-repeat:no-repeat;
      background-position:center right;
      background-size:520px auto;
      opacity:.45;
      filter:contrast(1.05) saturate(.95);
      z-index:-1;
      pointer-events:none;
    }

    .logo-area{display:flex;align-items:center;gap:14px;min-width:0}
    .logo-wrap{width:60px;height:60px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative}
    .logo-img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 16px rgba(255,215,0,.45))}
    .logo-svg-fallback{width:56px;height:56px;display:none;filter:drop-shadow(0 0 16px rgba(255,215,0,.35))}

    .header-text{min-width:0}
    .header-text h1{font-size:1.05rem;font-weight:900;letter-spacing:.02em;text-transform:uppercase;background:linear-gradient(135deg,#FFD700,#FFC107,#FFA000,#FFEB3B,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200% auto;animation:metalShine 3.2s linear infinite;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @keyframes metalShine{0%{background-position:0% center}100%{background-position:200% center}}
    .header-text p{font-size:.72rem;color:rgba(255,255,255,.86);margin-top:2px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    
    .header-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto}
    .user-stack{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    
    .user-badge{
      padding:7px 16px;
      background:rgba(255,255,255,.06);
      border-radius:10px;
      border:1.5px solid var(--gold);
      font-size:.76rem;
      font-weight:950;
      color:var(--gold-light);
      letter-spacing:.06em;
      white-space:nowrap;
      text-transform:uppercase;
      box-shadow:0 0 14px rgba(255,215,0,.22);
    }
    .countdown-header{
      font-family:'JetBrains Mono',monospace;
      font-size:.74rem;
      font-weight:950;
      color:#ff4444;
      letter-spacing:.02em;
      white-space:nowrap;
      text-shadow:0 0 8px rgba(255,68,68,.4);
    }
    .countdown-header b{color:#ff6666}
    .fs-btn{height:40px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--text);font-weight:950;user-select:none;transition:.15s}
    .fs-btn:hover{background:rgba(255,255,255,.12);border-color:var(--gold)}

    /* BARRA DE CONTROLE & BOTÕES TÁTEIS COM SÍMBOLOS */
    .timer-section{background:var(--surface);border-bottom:1px solid var(--border);padding:12px max(var(--template-pad),var(--safe-left));padding-right:max(var(--template-pad),var(--safe-right));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0;flex-wrap:wrap}
    .timer-section.glass{box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .timer-left{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
    .timer-display{font-family:'JetBrains Mono',monospace;font-size:1.65rem;font-weight:900;color:var(--gold-light);letter-spacing:-.02em}
    
    .timer-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
    
    .btn-tactile{
      height:44px;
      min-width:46px;
      padding:0 16px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition:all .14s cubic-bezier(.4,0,.2,1);
      font-weight:950;
      letter-spacing:.05em;
      user-select:none;
      box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);
      position:relative;
      overflow:hidden;
    }
    .btn-tactile .btn-sym{font-size:1.15rem;line-height:1;display:inline
